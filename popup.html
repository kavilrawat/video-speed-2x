<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speed Booster</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <img src="icon.png" alt="Icon" />
        <h1>Speed Booster</h1>
      </header>
      <section class="control">
        <div class="row">
          <label for="speedRange" class="label">Speed</label>
          <output id="speedValue">1.00x</output>
        </div>
        <input id="speedRange" type="range" min="0.25" max="5" step="0.25" />
        <div class="ticks" id="ticks"></div>
        <div class="row preset-row">
          <button class="preset" data-v="1">1x</button>
          <button class="preset" data-v="1.5">1.5x</button>
          <button class="preset" data-v="2">2x</button>
          <button class="preset" data-v="3">3x</button>
          <button class="preset" data-v="4">4x</button>
          <button class="preset" data-v="5">5x</button>
        </div>
      </section>
      <p class="hint">
        Hold Shift + Arrow Up/Down to adjust by +/-0.25x.
      </p>
    </div>
    <script src="popup.js"></script>
  </body>
  </html>
